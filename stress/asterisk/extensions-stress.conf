;==========================================================================
; extensions-stress.conf
;
; Contexto dedicado para la prueba de carga. Se incluye al final de
; /etc/asterisk/extensions.conf mediante:
;
;   #include "extensions-stress.conf"
;
; Define dos escenarios:
;   - Extension 7000 : Answer + Echo + Hangup (procesamiento simple)
;   - Extension 7100 : Answer + AGI taxi_agi.py + Hangup (logica de negocio)
;
; Asi se compara el costo de una llamada "vacia" contra una con consulta
; a SQLite, manteniendo la senalizacion SIP/RTP identica.
;==========================================================================

[from-stress]
; --- 7000: extension de carga "ligera" (echo) ---
exten => 7000,1,NoOp(STRESS-ECHO ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- 7100: extension de carga "real" (AGI taxi) ---
exten => 7100,1,NoOp(STRESS-AGI ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(taxi_agi.py)
 same => n,Hangup()
