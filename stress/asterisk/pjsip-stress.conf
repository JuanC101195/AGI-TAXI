;==========================================================================
; pjsip-stress.conf
;
; Configuracion adicional para PJSIP que crea un endpoint dedicado para
; pruebas de carga con SIPp. Se incluye al final de /etc/asterisk/pjsip.conf
; mediante la directiva:
;
;   #include "pjsip-stress.conf"
;
; El endpoint hereda del template del repo pero sobreescribe el contexto
; para enrutar al dialplan from-stress.
;==========================================================================

[6000](auth-template)
username=6000
password=StressPass6000!

[6000](aor-template)
max_contacts=200

[6000](endpoint-template)
auth=6000
aors=6000
allow=!all,ulaw,alaw
direct_media=no
context=from-stress
